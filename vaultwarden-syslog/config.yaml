name: Vaultwarden Syslog Forwarder
version: "1.0.0"
slug: vaultwarden_syslog

description: Forward Vaultwarden logs to remote syslog

startup: application
boot: auto

arch:
  - amd64

docker_api: true

options:
  container: app_a0d7b954_bitwarden
  syslog_host: 192.168.0.164
  syslog_port: 514
  protocol: udp

schema:
  container: str
  syslog_host: str
  syslog_port: port
  protocol: list(udp|tcp)
