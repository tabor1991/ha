name: Vaultwarden Syslog Forwarder
slug: vaultwarden-syslog
description: Forward Vaultwarden logs to remote syslog
version: "1.0.0"

arch:
  - amd64

startup: services
boot: auto

docker_api: true

options:
  container: app_a0d7b954_bitwarden
  syslog_host: 192.168.0.164
  syslog_port: 514
  protocol: udp
  tag: docker-vaultwarden
  reconnect_delay: 5

schema:
  container: str
  syslog_host: str
  syslog_port: port
  protocol: list(udp|tcp)
  tag: str
  reconnect_delay: int
